<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | 野江ミルクセンター</title>
    <link rel="icon" type="image/png" href="images/noe-milk-logo.png">
    <link rel="stylesheet" href="style.css?v=5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
      rel="stylesheet">
  </head>

  <body>
    <div class="app-shell subpage-shell">
      <header class="site-header" aria-label="サイトヘッダー">
        <a class="brand" href="index.html" aria-label="トップへ">
          <img src="images/noe-milk-longlogo.png" alt="野江ミルクセンター">
        </a>
        <a class="header-call" href="tel:080-2511-0197">電話</a>
      </header>

      <main>
        <section class="section page-title" aria-labelledby="contact-title">
          <p class="eyebrow">申し込み・ご相談</p>
          <h1 id="contact-title">お問い合わせ</h1>
          <p class="lead">配達エリア、商品、本数など、まだ決まっていない内容もお気軽にご相談ください。</p>
        </section>

        <section class="section">
          <form class="contact-form" action="https://formspree.io/f/xpwrbvdo" method="POST">
            <input type="hidden" name="_subject" value="【野江ミルクセンター】お問い合わせ">
            <label>お名前<input type="text" name="お名前" required></label>
            <label>フリガナ<input type="text" name="フリガナ" required></label>
            <label>郵便番号<input type="text" name="郵便番号" required></label>
            <label>住所<input type="text" name="住所" required></label>
            <label>電話番号<input type="tel" name="電話番号" required></label>
            <label>メールアドレス<input type="email" name="メールアドレス" required></label>
            <label>お問い合わせ内容<textarea name="お問い合わせ内容" rows="5" required></textarea></label>
            <label class="checkbox"><input type="checkbox" name="同意" required> <span><a href="privacy.html"
                  target="_blank">個人情報保護方針</a>に同意する</span></label>
            <button type="submit" class="button primary form-submit">送信する</button>
          </form>
        </section>
      </main>

      <footer class="site-footer">
        <p>© 2026 野江ミルクセンター</p>
        <a href="index.html">トップページへ戻る</a>
      </footer>
    </div>
  </body>

</html>
